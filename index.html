<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>スーツ猫の定時ダッシュ | JamSuki Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <section id="titleScreen" class="screen active">
      <div class="jarLogo">
        <div class="jarLid"></div><div class="jarCloth"></div>
        <div class="jarBody"><div class="jarLabel"><div class="berry">🍓</div><div class="brand">JamSuk<span class="paw-dot">🐾</span></div><div class="studio">Studio</div></div></div>
      </div>
      <h1>スーツ猫の<br>定時ダッシュ</h1>
      <p class="lead">魚・メール・コーヒーを集めて、定時まで走れ！</p>
      <button id="startBtn" class="primary">START 🐾</button>
      <p class="hint">スマホ：左右ボタン / PC：← → キー</p>
      <p id="bestTitle" class="best"></p>
    </section>
    <section id="gameScreen" class="screen">
      <div class="hud"><div>Score <strong id="score">0</strong></div><div>Time <strong id="time">30</strong></div><div>Best <strong id="best">0</strong></div></div>
      <div id="gameArea"><div id="cat"><div class="catHead"><span class="ear left"></span><span class="ear right"></span><span class="eye left"></span><span class="eye right"></span><span class="nose"></span><span class="mouth">ω</span></div><div class="suit"><span class="tie"></span></div></div></div>
      <div class="controls"><button id="leftBtn" class="ctrl">←</button><button id="rightBtn" class="ctrl">→</button></div>
    </section>
    <section id="resultScreen" class="screen">
      <h2>おつかれさま！</h2><p class="resultScore">Score <strong id="finalScore">0</strong></p><p id="resultMsg"></p><button id="againBtn" class="primary">もう一回 🐱</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
